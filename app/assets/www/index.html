<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#E85D04">
<title>StudyMitra</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brandrow">
      <img class="logo logoi" src="logo.png" alt="StudyMitra">
      <div class="brandtxt">
        <strong>StudyMitra</strong>
        <span>Study material, notes &amp; mock tests</span>
      </div>
      <button class="streak" id="streakChip" onclick="go('profile')">
        <span class="flame">&#128293;</span><b id="streakNum">1</b><small>day</small>
      </button>
    </div>
    <div class="searchwrap">
      <svg viewBox="0 0 24 24" class="sicon"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      <input id="globalSearch" type="search" placeholder="Search notes, chapters, tests..." autocomplete="off">
    </div>
  </header>

  <main id="main">
    <section class="screen" id="screen-home"></section>
    <section class="screen" id="screen-notes"></section>
    <section class="screen" id="screen-tests"></section>
    <section class="screen" id="screen-gk"></section>
    <section class="screen" id="screen-revise"></section>
    <section class="screen" id="screen-profile"></section>
    <section class="screen" id="screen-chapter"></section>
    <section class="screen" id="screen-player"></section>
    <section class="screen" id="screen-result"></section>
  </main>

  <nav class="bottomnav" id="bottomnav">
    <button data-nav="home" class="active" onclick="go('home')">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </button>
    <button data-nav="notes" onclick="go('notes')">
      <svg viewBox="0 0 24 24"><path d="M4 4h11l5 5v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm10 1.5V10h4.5L14 5.5zM7 13h10v1.6H7V13zm0 3.2h7v1.6H7v-1.6z"/></svg>
      <span>Notes</span>
    </button>
    <button data-nav="tests" onclick="go('tests')">
      <svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm8 2v4h4l-4-4zM8 12h8v2H8v-2zm0 4h8v2H8v-2z"/></svg>
      <span>Tests</span>
    </button>
    <button data-nav="revise" onclick="go('revise')">
      <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-2a7 7 0 1 1-2.05-4.95L14 10h7V3l-2.6 2.6A8.96 8.96 0 0 0 12 3zm-1 5v5l4 2.4.8-1.3-3.3-2V8H11z"/></svg>
      <span>Revise</span>
    </button>
    <button data-nav="profile" onclick="go('profile')">
      <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-3.3 0-8 1.7-8 4v2h16v-2c0-2.3-4.7-4-8-4z"/></svg>
      <span>Profile</span>
    </button>
  </nav>

  <div class="toast" id="toast"></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
